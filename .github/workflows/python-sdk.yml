name: Python SDK
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build==1.3.0 twine==6.2.0
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: .
      - run: python -m build . --outdir dist
      - run: twine check dist/*
      - run: |
          python -m venv /tmp/sdk-wheel
          /tmp/sdk-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/sdk-wheel/bin/python -c 'from hyperoptimizer import Run; from hyperoptimizer.types import Histogram'
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-distributions
          path: dist/
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify version tag
        run: |
          python - <<'PYTHON'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version
          PYTHON
      - uses: actions/download-artifact@v4
        with:
          name: sdk-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
